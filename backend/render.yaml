services:
  - type: web
    name: skyfussion-analytics-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: LLM_PROVIDER
        value: gemini
      - key: EVENT_BACKEND
        value: local
      - key: CORS_ORIGINS
        sync: false
        value: gemini-2.5-flash
      - key: DEMO_MODE
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "*"
